{% extends 'users/base.html' %}
{% load static %}

{% block title %}Добавить отзыв{% endblock %}

{% block content %}
    <div class="class-review">
        <h1>Добавить отзыв</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Отправить</button>
        </form>
        <a href="{% url 'reviews' %}">Назад к отзывам</a>
    </div>
{% endblock %}
