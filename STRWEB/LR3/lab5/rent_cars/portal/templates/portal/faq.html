{% extends 'users/base.html' %} 

{% block title %}Часто задаваемые вопросы{% endblock %}

{% block content %}
    <div class="faq-container">
        <h1>Часто задаваемые вопросы (FAQ)</h1>
            {% for faq in faqs %}
            <details>
                <summary>{{ faq.question }}</summary>
                <p>{{ faq.answer }}</p>
                <p><em>Добавлено: {{ faq.date_added }}</em></p>
            </details>
        {% endfor %} 
    </div>
    <br>
{% endblock %}
